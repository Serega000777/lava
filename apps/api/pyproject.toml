[project]
name = "lava-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.17.2",
  "argon2-cffi==25.1.0",
  "asyncpg==0.31.0",
  "boto3==1.42.70",
  "fastapi==0.141.1",
  "msgpack==1.2.2",
  "pillow==12.3.0",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.32",
  "redis==7.1.0",
  "sqlalchemy==2.0.44",
  "starlette==1.6.0",
  "structlog==25.5.0",
  "uvicorn[standard]==0.38.0"
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==9.0.1", "pytest-asyncio==1.3.0", "ruff==0.14.8"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
